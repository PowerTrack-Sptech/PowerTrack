<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerTrack | Cadastro</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="icon" href="../assets/logo_dois.png" type="image/png">
</head>

<body>
    <div class="cabecalho">
        <ul class="menu">
            <img src="../assets/logo.svg" alt="logo">
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="index.html">Sobre nós</a>
            </li>
            <li>
                <a href="index.html">Nossa solução</a>
            </li>
            <li>
                <a href="calculadora.html">Simulador financeiro</a>
            </li>
            <a href="login.html"><button class="botao-login">Login</button></a>
        </ul>
    </div>
    <div class="box-login-pai">
        <img class="logo-dois" src="../assets/logo_sem_fundo.png" alt="logo">
        <div class="box-login-filho">
            <div class="boas-vindas">
                <span>Cadastrar</span>
            </div>
            <div class="campos">

                <label for="ipt_nome"><img src="../assets/ICONS_AZUL/usuario.svg" alt="">Nome</label>
                <input type="text" id="ipt_nome" value="" placeholder="Digite o seu primeiro nome">
                <br>
                <label for="ipt_nome"><img src="../assets/ICONS_AZUL/usuario.svg" alt="">Sobrenome</label>
                <input type="text" id="ipt_sobrenome" value="" placeholder="Digite o seu sobrenome">
                <br>
                <label for="ipt_email"><img src="../assets/ICONS_AZUL/email.svg" alt="">E-mail</label>
                <input type="text" id="ipt_email" value="" placeholder="seuemail@empresa.com">
                <br>
                <label for="ipt_empresa"><img src="../assets/ICONS_AZUL/data_center.svg" alt="">Código da Empresa</label>
                <input type="text" id="ipt_empresa" value="" placeholder="Digite o código da empresa">
                <br>
                <label for="ipt_senha"><img src="../assets/ICONS_AZUL/senha.svg" alt="">Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite a senha">
                <br>
                <label for="ipt_confirmarSenha"><img src="../assets/ICONS_AZUL/senha.svg" alt="">Confirmar Senha</label>
                <input type="password" id="ipt_confirmarSenha" placeholder="Confirmar a senha">

            </div>
            <div class="box-checkbox-pai">
                <input type="checkbox" id="chk_termos">
                <label for="chk_termos">
                    Li e concordo com os <a href="#">Termos de Uso</a> e <br> <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <div class="botao-entrar">
                <button onclick="cadastrar()">Cadastrar</button>
            </div><br>
            <div id="msg_senha"></div>
            <div class="seguranca">
                <img src="../assets/icon_defender.png" alt="">
                <span> Seus dados estão protegido de ponta a ponta.</span>
            </div>

        </div>
    </div>
</body>
<script>
    let bancoNomes = []
    let bancoEmails = []
    let bancoSenhas = []

    function cadastrar() {
        let nome = ipt_nome.value.trim()
        let email = ipt_email.value.trim()
        let empresa = ipt_empresa.value.trim()
        let sobrenome = ipt_sobrenome.value.trim()
        let senha = ipt_senha.value
        let confirmarSenha = ipt_confirmarSenha.value
        let tudoCerto = true;

        if (nome == "" || email == "" || empresa == "" ||  sobrenome =="" || senha == "" || confirmarSenha == "") {
            msg_senha.innerHTML = `<div class="senha">Por favor, preencha todos os campos!</div>`
            tudoCerto = false
        }

        if (tudoCerto == true && senha != confirmarSenha) {
            msg_senha.innerHTML = `<div class="senha">As senhas não coincidem!</div>`
            tudoCerto = false
        }

        if (tudoCerto == true && bancoEmails.includes(email)) {
            msg_senha.innerHTML = `<div class="senha">Este e-mail já está cadastrado!</div>`
            tudoCerto = false
        }

        let aux = 0;
        let achouArroba = false

        while (aux < email.length && achouArroba == false) {
            if (email[aux] == '@') {
                achouArroba = true;
            }
            aux++;
        }

        aux = 0;
        let qtdSenha_sufuciente = false;
        let qtdCaracteres = 0;

        while (aux < senha.length) {
            qtdCaracteres++;
            aux++;
        }

        if (qtdCaracteres >= 8) {
            qtdSenha_sufuciente = true;
        }

        if (achouArroba == false && tudoCerto == true) {
            msg_senha.innerHTML = `<div class="senha">O e-mail precisa ter @!</div>`;
            tudoCerto = false;
        }

        if (qtdSenha_sufuciente == false && tudoCerto == true) {
            msg_senha.innerHTML = `<div class="senha">A senha precisa ter 8 ou mais caracteres!</div>`;
            tudoCerto = false;
        }


        if (tudoCerto == true) {
            bancoNomes.push(nome)
            bancoEmails.push(email)
            bancoSenhas.push(senha)

            msg_senha.innerHTML = `<div class="senhaCerta">Cadastro efetuado com sucesso, ${nome}!</div>`
        }
    }
</script>

</html>
