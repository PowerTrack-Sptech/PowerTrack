<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerTrack | Cadastro</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="icon" href="../assets/logo_dois.png" type="image/png">
</head>

<body>
    <div class="cabecalho">
        <ul class="menu">
            <img src="../assets/logo.png" alt="logo">
            <li>
                <a href="#">Home</a>
            </li>
            <li>
                <a href="#">Sobre nós</a>
            </li>
            <li>
                <a href="#">Nossa solução</a>
            </li>
            <li>
                <a href="#">Simulador financeiro</a>
            </li>
        </ul>
        <div>
            <button onclick="">Login</button>
        </div>
    </div>
    <div class="box-login-pai">
        <img class="logo-dois" src="../assets/logo_dois.png" alt="logo">
        <div class="box-login-filho">
            <div class="boas-vindas">
                <span>Cadastrar</span>
            </div>
            <div class="campos">

                <label for="ipt_nome"><img src="../assets/icon_pessoa.png" alt="">Nome Completo</label>
                <input type="text" id="ipt_nome" value="" placeholder="Digite o seu nome completo">

                <label for="ipt_email"><img src="../assets/icon_email.png" alt="">E-mail</label>
                <input type="text" id="ipt_email" value="" placeholder="seuemail@empresa.com">

                <label for="ipt_empresa"><img src="../assets/icon_empresa.png" alt="">Empresa</label>
                <input type="text" id="ipt_empresa" value="" placeholder="Nome da sua empresa">

                <label for="ipt_telefone"><img src="../assets/icon_email.png" alt="">Telefone</label>
                <input type="text" id="ipt_telefone" placeholder="(00)00000-0000">

                <label for="ipt_senha"><img src="../assets/icon_password.png" alt="">Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite a senha">

                <label for="ipt_confirmarSenha"><img src="../assets/icon_password.png" alt="">Confirmar Senha</label>
                <input type="password" id="ipt_confirmarSenha" placeholder="Confirmar a senha">

            </div>
            <div class="box-checkbox-pai">
                <input type="checkbox" id="chk_termos">
                <label for="chk_termos">
                    Li e concordo com os <a href="#">Termos de Uso</a> e <br> <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <div class="botao-entrar">
                <button onclick="cadastrar()">Cadastrar</button>
            </div><br>
            <div id="div_mensagem"></div>
            <div class="seguranca">
                <img src="../assets/icon_defender.png" alt="">
                <span> Seus dados estão protegido de ponta a ponta.</span>
            </div>

        </div>
    </div>
</body>
<script>
    let bancoNomes = []
    let bancoEmails = []
    let bancoSenhas = []

    function cadastrar() {
        let nome = ipt_nome.value.trim()
        let email = ipt_email.value.trim()
        let empresa = ipt_empresa.value.trim()
        let telefone = ipt_telefone.value.trim()
        let senha = ipt_senha.value
        let confirmarSenha = ipt_confirmarSenha.value
        let tudoCerto = true;

        if (nome == "" || email == "" || empresa == "" || telefone == "" || senha == "" || confirmarSenha == "") {
            div_mensagem.innerHTML = "Por favor, preencha todos os campos!"
            tudoCerto = false
        }

        if (tudoCerto == true && senha != confirmarSenha) {
            div_mensagem.innerHTML = "As senhas não coincidem!"
            tudoCerto = false
        }

        if (tudoCerto == true && bancoEmails.includes(email)) {
            div_mensagem.innerHTML = "Este e-mail já está cadastrado!"
            tudoCerto = false
        }

        let aux = 0;
        let achouArroba = false

        while (aux < email.length && achouArroba == false) {
            if (email[aux] == '@') {
                achouArroba = true;
            }
            aux++;
        }

        aux = 0;
        let qtdSenha_sufuciente = false;
        let qtdCaracteres = 0;

        while (aux < senha.length) {
            qtdCaracteres++;
            aux++;
        }

        if (qtdCaracteres >= 8) {
            qtdSenha_sufuciente = true;
        }

        if (achouArroba == false && tudoCerto == true) {
            div_mensagem.innerHTML = "O e-mail precisa ter @!";
            tudoCerto = false;
        }

        if (qtdSenha_sufuciente == false && tudoCerto == true) {
            div_mensagem.innerHTML = `A senha precisa ter 8 ou mais caracteres`;
            tudoCerto = false;
        }


        if (tudoCerto == true) {
            bancoNomes.push(nome)
            bancoEmails.push(email)
            bancoSenhas.push(senha)

            div_mensagem.innerHTML = `Cadastro efetuado com sucesso, ${nome}!`
        }
    }
</script>

</html>
