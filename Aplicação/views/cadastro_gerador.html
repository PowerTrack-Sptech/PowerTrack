<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastro_gerador.css">
    <title>PowerTrack | Cadastro Gerador</title>
    <link rel="icon" href="../assets/logo_dois.png" type="image/png">
</head>
<body>
    <div class="cabecalho">
        <ul class="menu">
            <li>
                <img src="../assets/logo.svg" alt="Logo PowerTrack">
            </li>
            <li><a href="../views/dashboard.html"> <img src="../assets/ICONS_BRANCO/visao_geral.svg" alt="">Visão geral</a></li>
            <li><a class="ativo" href="#"> <img src="../assets/ICONS_BRANCO/geradores.svg" alt="">Geradores</a></li>
            <li><a href="index_logado.html"><img src="../assets/ICONS_BRANCO/inicio.svg" alt="">Home</a></li>


            <li class="perfil-usuario">
                <img
                class="perfil"
                src="../assets/logo_sptech_perfil.png"
                alt="Logo da SPTech">

                <p>
                    USER 01<br>
                    SPTech
                </p>
                </p>

            <a href="index.html">
                <img src="../assets/ICONS_BRANCO/logout.svg"
                     alt="">Logout
                    </a>
            </li>
        </ul>
    </div>

    <main class="pagina">

        <div class="topo-pagina">
            <div class="titulo-pagina">
                <h1>Cadastro de Geradores</h1>
            </div>

            <div class="acoes-topo">
                <select id="slc_geradores">
                    <option value="">Nenhum gerador cadastrado</option>
                </select>
                <button class="botao-acao botao-editar" onclick="editarGerador()">Editar</button>
                <button class="botao-acao botao-excluir" onclick="excluirGerador()">Excluir</button>
            </div>
        </div>

        <div class="card-cadastro">

            <img class="logo-card" src="../assets/logo_sem_fundo.png" alt="Logo PowerTrack">

            <div class="campos-gerador">

                <div class="campo">
                    <label for="ipt_nome">Nome</label>
                    <input type="text" id="ipt_nome" placeholder="Ex: GER - 6">
                </div>

                <div class="campo">
                    <label for="ipt_modelo">Modelo</label>
                    <input type="text" id="ipt_modelo" placeholder="Ex: VoltForce">
                </div>

                <div class="campo">
                    <label for="ipt_capacidade">Capacidade do Tanque (L)</label>
                    <input type="number" id="ipt_capacidade" placeholder="Ex: 12000">
                </div>

                <div class="campo">
                    <label for="ipt_profundidade">Profundidade do Tanque (cm)</label>
                    <input type="number" id="ipt_profundidade" placeholder="Ex: 200">
                </div>

                <div class="campo">
                    <label for="ipt_largura">Largura do Tanque (cm)</label>
                    <input type="number" id="ipt_largura" placeholder="Ex: 200">
                </div>

                <div class="campo">
                    <label for="ipt_altura">Altura do Tanque (cm)</label>
                    <input type="number" id="ipt_altura" placeholder="Ex: 250">
                </div>

            </div>

            <div class="botao-cadastrar">
                <button id="btn_cadastrar" onclick="cadastrarGerador()">Cadastrar</button>
                <button class="botao-cancelar" id="btn_cancelar" style="display: none" onclick="cancelarEdicao()">Cancelar</button>
            </div>

            <div id="msg_gerador"></div>

        </div>

    </main>

    <script>
        let listaGeradores = []

        let indiceEdicao = -1

        function atualizarSelect() {
            let opcoes = ""

            if (listaGeradores.length == 0) {
                opcoes = `<option value="">Nenhum gerador cadastrado</option>`
            } else {
                opcoes = `<option value="">Selecione um gerador</option>`

                for (let i = 0; i < listaGeradores.length; i++) {
                    opcoes = opcoes + `<option value="${i}">${listaGeradores[i].nome} - ${listaGeradores[i].modelo}</option>`
                }
            }

            slc_geradores.innerHTML = opcoes
        }

        function limparCampos() {
            ipt_nome.value = ""
            ipt_modelo.value = ""
            ipt_capacidade.value = ""
            ipt_profundidade.value = ""
            ipt_largura.value = ""
            ipt_altura.value = ""

            indiceEdicao = -1
            btn_cadastrar.innerHTML = "Cadastrar"
            btn_cancelar.style.display = "none"
        }

        function cadastrarGerador() {
            let nome = ipt_nome.value.trim()
            let modelo = ipt_modelo.value.trim()
            let capacidade = Number(ipt_capacidade.value)
            let profundidade = Number(ipt_profundidade.value)
            let largura = Number(ipt_largura.value)
            let altura = Number(ipt_altura.value)
            let tudoCerto = true

            if (nome == "" || modelo == "" || ipt_capacidade.value == "" || ipt_profundidade.value == "" || ipt_largura.value == "" || ipt_altura.value == "") {
                msg_gerador.innerHTML = `<div class="msg-erro">Por favor, preencha todos os campos!</div>`
                tudoCerto = false
            }

            if (tudoCerto == true && (capacidade <= 0 || profundidade <= 0 || largura <= 0 || altura <= 0)) {
                msg_gerador.innerHTML = `<div class="msg-erro">A capacidade e as medidas precisam ser maiores que zero!</div>`
                tudoCerto = false
            }

            for (let i = 0; i < listaGeradores.length; i++) {
                if (tudoCerto == true && i != indiceEdicao && listaGeradores[i].nome.toLowerCase() == nome.toLowerCase()) {
                    msg_gerador.innerHTML = `<div class="msg-erro">Já existe um gerador com esse nome!</div>`
                    tudoCerto = false
                }
            }

            if (tudoCerto == true) {
                let gerador = {
                    nome: nome,
                    modelo: modelo,
                    capacidade: capacidade,
                    profundidade: profundidade,
                    largura: largura,
                    altura: altura
                }

                if (indiceEdicao == -1) {
                    listaGeradores.push(gerador)
                    msg_gerador.innerHTML = `<div class="msg-sucesso">Gerador ${nome} cadastrado com sucesso!</div>`
                } else {
                    listaGeradores[indiceEdicao] = gerador
                    msg_gerador.innerHTML = `<div class="msg-sucesso">Gerador ${nome} atualizado com sucesso!</div>`
                }

                limparCampos()
                atualizarSelect()
            }
        }

        function editarGerador() {
            let posicao = slc_geradores.value

            if (posicao == "") {
                msg_gerador.innerHTML = `<div class="msg-erro">Escolha um gerador na lista para editar!</div>`
            } else {
                let gerador = listaGeradores[posicao]

                ipt_nome.value = gerador.nome
                ipt_modelo.value = gerador.modelo
                ipt_capacidade.value = gerador.capacidade
                ipt_profundidade.value = gerador.profundidade
                ipt_largura.value = gerador.largura
                ipt_altura.value = gerador.altura

                indiceEdicao = Number(posicao)
                btn_cadastrar.innerHTML = "Salvar alterações"
                btn_cancelar.style.display = "inline-block"

                msg_gerador.innerHTML = `<div class="msg-sucesso">Editando o gerador ${gerador.nome}.</div>`
            }
        }

        function excluirGerador() {
            let posicao = slc_geradores.value

            if (posicao == "") {
                msg_gerador.innerHTML = `<div class="msg-erro">Escolha um gerador na lista para excluir!</div>`
            } else {
                let nome = listaGeradores[posicao].nome

                if (confirm(`Deseja realmente excluir o gerador ${nome}?`)) {
                    listaGeradores.splice(posicao, 1)

                    limparCampos()
                    atualizarSelect()

                    msg_gerador.innerHTML = `<div class="msg-sucesso">Gerador ${nome} excluído com sucesso!</div>`
                }
            }
        }

        function cancelarEdicao() {
            limparCampos()
            msg_gerador.innerHTML = ""
        }
    </script>
</body>
</html>
