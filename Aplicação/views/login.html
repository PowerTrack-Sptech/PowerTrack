<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerTrack | Login</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="icon" href="../assets/logo_dois.png" type="image/png">
</head>


<body>
    <div class="cabecalho">
        <ul class="menu">
            <img src="../assets/logo.png" alt="logo">
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="index.html">Sobre nós</a>
            </li>
            <li>
                <a href="index.html">Nossa solução</a>
            </li>
            <li>
                <a href="calculadora.html">Simulador financeiro</a>
            </li>
        </ul>
        <div>
            <a href="login.html"><button class="botao-login">Login</button></a>
        </div>
    </div>

    <div class="conteudo">
        <img class="logo-dois" src="../assets/logo_dois.png" alt="PowerTrack">

        <div class="box-login">
            <div class="boas-vindas">
                <h4>Bem vindo(a)</h4>
                <span>Entre na sua conta para continuar.</span>
            </div>
            <div class="titulo-login">
                <h4>Insira seu login</h4>
            </div>
            <div class="campos">
                <img src="../assets/ICONS_AZUL_ESCURO/email.svg" alt="">
                <label for="ipt_email">E-mail</label>
                <br>
                <input type="text" id="ipt_email" value="" placeholder="Digite o email da academia">
                <br>
                <img src="../assets/ICONS_AZUL_ESCURO/senha.svg" alt="">
                <label for="ipt_senha">Senha</label>
                <br>
                <input type="password" id="ipt_senha" placeholder="Digite a senha">
                <div id="div_msg_senha"></div>
            </div>

            <div class="botao-entrar">
                <a href="../views/dashboard.html"><button onclick="Entrar()">Entrar</button></a>
            </div>

            <div class="links">
                <a href="#">Esqueceu a senha?</a>
                <br>
                <a href="../views/cadastro.html">Cadastre-se</a>
            </div>

            <div class="seguranca">
                <img src="../assets/icon_defender.png" alt="segurança">
                <span> Seus dados estão protegido de ponta a ponta.</span>
            </div>

        </div>
    </div>
</body>
<script>
    let Banco = ["joao123@gmail.com", "brandao@gmail.com", "heitor@gmail.com"]
    let Banco_Senha = ["joao1234", "brandao123", "heitor123"]

    function Entrar() {
        let email = ipt_email.value.trim()
        let senha = ipt_senha.value
        let indice = Banco.indexOf(email);
        let tudoCerto = false;

        if (indice != -1 && Banco_Senha[indice] == senha) {
            tudoCerto = true;
            div_msg_senha.innerHTML = `Logado com sucesso!`   
        }
        else {
            div_msg_senha.innerHTML = `Senha ou E-mail inválido!`;
        }
    }
</script>

</html>
