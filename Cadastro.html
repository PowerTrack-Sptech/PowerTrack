<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>


<body>
    <div class="cabecalho">
        <ul class="menu">
            <img src="assets/logo.png" alt="logo">
            <li>
                <a href="#">Home</a></a>
            </li>
            <li>
                <a href="#">Sobre nós</a></a>
            </li>
            <li>
                <a href="#">Nossa solução</a></a>
            </li>
            <li>
                <a href="#">Simulador financeiro</a></a>
            </li>
        </ul>
        <div>
            <button onclick="">Login</button>
        </div>
    </div>
    <div class="box-login">
        <div class="boas-vindas">
            <h4>Cadastrar</h4>
            <span>Entre na sua conta para continuar.</span>
        </div>
        <div class="titulo-login">
        </div>
        <div class="campos">
            <img src="" alt="">
            <label for="ipt_nome">Nome Completo</label>
            <br>
            <input type="text" id="ipt_nome" value="">
            <img src="assets/icon_email.png" alt=""><br>
            <label for="ipt_email">E-mail</label>
            <br>
            <input type="text" id="ipt_email" value="">
            <br>
            <img src="" alt="">
            <label for="ipt_empresa">Empresa</label>
            <br>
            <input type="text" id="ipt_empresa"><br>
            <img src="" alt="">
            <label for="ipt_telefone">telefone</label>
            <br>
            <input type="text" id="ipt_telefone"><br>

            <img src="assets/icon_password.png" alt="">
            <label for="ipt_senha">Senha</label>
            <br>
            <input type="password" id="ipt_senha"><br>
            <img src="assets/icon_password.png" alt="">
            <label for="ipt_confirmarSenha">Confirmar Senha</label>
            <br>
            <input type="password" id="ipt_confirmarSenha">

            <div id="div_msg_senha"></div>
        </div>
        <div>
            <input type="checkbox" id="chk_termos">
            <label for="chk_termos">
                Li e concordo com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
            </label>
        </div>

        <div class="botao-entrar">
            <button onclick="cadastrar()">Cadastrar</button>
        </div>

        <div class="links">
            <a href="#">Esqueceu a senha?<a>
                    <br>
                    <a href="login.html">Login</a>
        </div>

        <div class="seguranca">
            <img src="assets/icon_defender.png" alt="segurança">
            <span> Seus dados estão protegido de ponta a ponta.</span>
        </div>

    </div>
</body>
<script>

    function cadastrar() {
        let bancoNomes = [];
        let bancoEmails = [];
        let bancoSenhas = [];

        function cadastrar() {
            let nome = ipt_nomeCompleto.value.trim();
            let email = ipt_email.value.trim();
            let empresa = ipt_empresa.value.trim();
            let telefone = ipt_telefone.value.trim();
            let senha = ipt_senha.value;
            let confirmarSenha = ipt_confirmarSenha.value;

            if (nome == "" || email == "" || empresa == "" || telefone == "" || senha == "" || confirmarSenha == "") {
                div_msg_senha.innerHTML = "Por favor, preencha todos os campos!";
            }

            if (senha != confirmarSenha) {
                div_msg_senha.innerHTML = "As senhas não coincidem!";
            }

            if (bancoEmails.includes(email)) {
                div_msg_senha.innerHTML = "Este e-mail já está cadastrado!";
            }

            bancoNomes.push(nome);
            bancoEmails.push(email);
            bancoSenhas.push(senha);

            div_msg_senha.innerHTML = `Cadastro efetuado com sucesso, ${nome}!`;
        }
    }    
</script>

</html>
